name: fetch

# Daily data refresh: fetch, validate, average, then one commit prefixed "data:" if a file changed.
# A failed pull keeps the last good rows and marks the contest stale in data/quality.json; the job
# then ends red so the failure is seen, after committing what did succeed.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Validate configuration
        run: python tools/validate_config.py
      - name: Fetch, validate and average
        id: run
        run: python -m pipeline.run
        continue-on-error: true
      - name: Commit changed data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data change."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git push
          fi
      - name: Fail if any pull failed
        if: steps.run.outcome == 'failure'
        run: |
          echo "At least one pull failed. See data/quality.json for the stale contests."
          exit 1
