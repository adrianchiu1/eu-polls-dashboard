  - id: FR-001
    country: FR
    scope: presidential line-ups
    question: Which candidate line-up headlines when a pollster tests several?
    decision: The line-up closest to the declared field of candidates. One line-up per pollster enters the average.
    rationale: Averaging across hypothetical fields would mix different questions.
    alternatives:
      - Average every tested line-up.
      - Show only line-ups common to all pollsters; often none exists.
    evidence: [SPEC.md section 3]
    confidence: low
    status: on_watch
    decided_on: 2026-11-23
    decided_by: draft
    review_by: 2026-12-23
    triggers: [A candidate declares or withdraws, A party selects its nominee, The official candidate list is published]

  - id: FR-002
    country: FR
    scope: parliamentary subsection
    question: Is National Assembly polling shown although no election is scheduled?
    decision: Yes, as the subsection under the presidential headline, marked unscheduled.
    rationale: Owner's choice. A dissolution after the presidential vote is widely expected.
    alternatives:
      - Hide it until an election is called.
    evidence: [config/contests.yaml fr-parl-next]
    confidence: medium
    status: on_watch
    decided_on: 2026-11-23
    decided_by: owner
    review_by: 2026-12-23
    triggers: [The Assembly is dissolved, An election date is set]

  - id: IT-001
    country: IT
    scope: coalitions and date
    question: Which parties make up each coalition total, and when is the election?
    decision: >-
      Coalition membership is defined in config/parties/IT.yaml and revisited when alliances are
      formally filed. The contest carries only its legal deadline of 22 Dec 2027.
    rationale: Alliances are fluid before filing; an early spring 2027 vote is discussed but not called.
    alternatives:
      - Show parties only, with no coalition totals.
    evidence: [config/contests.yaml it-parl-2027]
    confidence: low
    status: on_watch
    decided_on: 2026-11-23
    decided_by: draft
    review_by: 2026-12-23
    triggers: [Parliament is dissolved, An election date is set, A coalition agreement is announced, The electoral law ruling is published]

