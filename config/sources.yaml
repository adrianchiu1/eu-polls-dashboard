  # ---------------------------------------------------------------- France (Wikipedia)
  - contest_id: fr-pres-2027
    adapter: wikipedia
    locator: Opinion polling for the 2027 French presidential election
    selector: top=First round; round2_top=Second round; exclude=No longer candidates; lineups=field
    column_map: {}
    priority: 1
    verified: true
    notes: >-
      Candidate-keyed. Each tested field of candidates is one lineup_id. Title resolved through the
      MediaWiki API on 2026-11-23 (revision 1387074180).
  - contest_id: fr-parl-next
    adapter: wikipedia
    locator: Next French legislative election
    selector: top=Opinion polls
    column_map: {}
    priority: 1
    verified: true
    notes: >-
      Resolved through the MediaWiki API on 2026-11-23 (revision 1383966200). The seeded title,
      "Opinion polling for the 2027 French legislative election", is a redirect to the Opinion polling
      section of this article; there is no dedicated polling article yet. Table layout not inspected.

