# Which source feeds which contest. Pilot countries first (DE, FR, IT, ES, UK), plus Sweden,
# whose source is already known.
#
# verified: true   the locator was seen to exist on 2026-11-23
#           false  best guess; resolve through the source's API and correct this file
# Wikipedia locators are article titles after following redirects, so a fetch pins the right page.
# priority: 1 is the primary source for the contest; higher numbers are cross-checks.
# selector: for the wikipedia adapter, key=value pairs read by pipeline/adapters/wikipedia.py (its
#           docstring lists the keys). Entries still in prose have no parser yet (Phase 3).
# column_map: header label -> party id, or a role (pollster, date, sample, client, area, ignore),
#           for labels the party file's short names and aliases do not already cover.
schema_version: 1
sources:
