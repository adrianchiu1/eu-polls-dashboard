  # ---------------------------------------------------------------- Sweden (SwedishPolls)
  - contest_id: se-parl-next
    adapter: swedishpolls
    locator: https://github.com/MansMeg/SwedishPolls
    selector: Data/Polls.csv
    column_map:
      pollster: house
      fieldwork_start: collectPeriodFrom
      fieldwork_end: collectPeriodTo
      sample_size: n
      published: PublDate
    priority: 1
    verified: true
    notes: >-
      Party columns M, L, C, KD, S, V, MP, SD, FI. Missing values are the literal NA. Keep only rows
      whose collectPeriodTo is after 2026-09-13.
